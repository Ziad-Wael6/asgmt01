<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <!-- header content -->
      <h2>Contact Us</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">about</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <h2>Contact Us</h2>
      <form method="post">
        <!-- Text Input -->
        <div class="form-group">
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required />
        </div>

        <!-- Email Input -->
        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <!-- Number Input -->
        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" min="1" max="100" />
        </div>

        <!-- Date Input -->
        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" name="date" />
        </div>

        <!-- Radio Buttons -->
        <div class="form-group">
          <label>Gender:</label>
          <div class="options-group">
            <input type="radio" name="gender" value="male" checked />
            <label>Male</label>
            <input type="radio" name="gender" value="female" />
            <label>Female</label>
          </div>
        </div>

        <!-- Checkboxes -->
        <div class="form-group">
          <label>Programming:</label>
          <div class="options-group">
            <input type="checkbox" id="css" name="interests" value="html" />
            <label for="html">HTML</label>
            <input type="checkbox"  id="css" name="interests" value="css"/>
            <label for="css">CSS</label>
            <input type="checkbox"  id="js" name="interests" value="js" checked />
            <label for="js">JavaScript</label>
          </div>
        </div>

        <!-- Select -->
        <div class="form-group">
          <label for="subject">Subject:</label>
          <select id="subject" name="subject">
            <option value="system">System</option>
            <option selected value="database">DataBase</option>
            <option value="webdevelopment">Web Developement</option>
            <option value="networking">Networking</option>
          </select>
        </div>

        <!-- Textarea -->
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5"></textarea>
        </div>

        <div class="btns">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </div>
      </form>
    </main>

    <footer>
      <!-- footer content -->
      <p>Footer Content</p>
    </footer>
  </body>
</html>
